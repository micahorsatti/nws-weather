<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Glow centered on the sun, fading to #0f172a at the tile edge, so the edge matches the solid
         fill used for the maskable and apple-touch icons and no seam shows at the corners. -->
    <radialGradient id="tile" gradientUnits="userSpaceOnUse" cx="210" cy="210" r="200">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </radialGradient>
    <radialGradient id="sun" cx="0.36" cy="0.34" r="0.8">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="0.45" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </radialGradient>
    <!-- Cuts a dark halo around the cloud out of the sun so the two shapes separate cleanly. -->
    <mask id="halo" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#ffffff"/>
      <g fill="#000000" stroke="#000000" stroke-width="36" stroke-linejoin="round">
        <circle cx="200" cy="312" r="50"/>
        <circle cx="270" cy="278" r="72"/>
        <circle cx="354" cy="328" r="44"/>
        <rect x="136" y="306" width="272" height="82" rx="41"/>
      </g>
    </mask>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <g transform="translate(256 256) scale(1.08) translate(-256 -256)">
    <circle cx="196" cy="212" r="92" fill="url(#sun)" mask="url(#halo)"/>
    <g fill="#ffffff">
      <circle cx="200" cy="312" r="50"/>
      <circle cx="270" cy="278" r="72"/>
      <circle cx="354" cy="328" r="44"/>
      <rect x="136" y="306" width="272" height="82" rx="41"/>
    </g>
  </g>
</svg>
