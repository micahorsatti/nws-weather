name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

      - name: Check that the PWA build artifacts exist
        run: |
          for file in dist/index.html dist/sw.js dist/manifest.webmanifest \
                      dist/pwa-192x192.png dist/pwa-512x512.png; do
            if [ ! -s "$file" ]; then
              echo "::error file=$file::Expected build artifact is missing or empty"
              exit 1
            fi
          done

      - name: Scan tracked files for secrets
        run: |
          # git grep searches the same files that `git ls-files` lists. Only file names are
          # printed, never the matching text, because the logs of this public repository are public.
          set +e
          hits=$(git grep -I -l -E \
            -e 'sk-ant-[A-Za-z0-9_-]{20,}' \
            -e 'API_KEY=[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}' \
            -- ':(exclude)package-lock.json')
          status=$?
          set -e
          case "$status" in
            0)
              echo "::error::Possible secret found in these tracked files:"
              echo "$hits"
              exit 1
              ;;
            1)
              echo "No secret patterns found in tracked files."
              ;;
            *)
              echo "::error::git grep failed with exit status $status"
              exit "$status"
              ;;
          esac
